<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100" role="img" aria-label="Gracias por visitar mi perfil">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16244a"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p { font: 500 20px 'Courier New', monospace; fill: #38bdf8; }
    .m { font: 500 20px 'Courier New', monospace; fill: #e2e8f0; }
    .cur { fill: #38bdf8; animation: blink 1s steps(1) infinite; }
    .sw { animation: slide 3.5s ease-in-out infinite alternate; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(600px); } }
  </style>
  <rect width="900" height="100" rx="16" fill="url(#bg)"/>
  <text class="m" x="450" y="52" text-anchor="middle"><tspan class="p">$ </tspan>gracias por visitar mi perfil<tspan class="cur">_</tspan></text>
  <rect x="0" y="80" width="900" height="2" fill="#38bdf8" fill-opacity="0.15"/>
  <rect class="sw" x="0" y="79" width="300" height="4" rx="2" fill="url(#sweep)"/>
</svg>
