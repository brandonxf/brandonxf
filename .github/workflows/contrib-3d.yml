name: Update profile graphics

on:
  # Cada 6 horas (el minuto 17 evita la hora pico de :00, donde GitHub mas retrasa los cron)
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  # Regenera al instante cuando cambias los scripts o este workflow
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/contrib-3d.yml"

permissions:
  contents: write

# Evita que dos corridas se pisen al hacer push
concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Si agregas el secret PROFILE_TOKEN (PAT con permiso read:user) las graficas
      # incluyen tus contribuciones privadas. Sin el, usa el token normal (solo publicas).
      - name: Generate contributions 3D
        run: node scripts/generate-contrib-3d.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Generate snake
        run: node scripts/generate-snake.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Update repos badge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          count=$(gh api "users/$GH_USER" --jq .public_repos)
          printf '{"schemaVersion":1,"label":"Repos","message":"%s","color":"0e75b6"}\n' "$count" > assets/repos-badge.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-3d.svg assets/snake-game.svg assets/repos-badge.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: actualizar graficas del perfil"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
